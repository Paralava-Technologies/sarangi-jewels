# Production Nginx — sarangijewels.com
# Domains: sarangijewels.com | admin.sarangijewels.com | api.sarangijewels.com
# TLS certs from Let's Encrypt via certbot (mounted at /etc/nginx/certs)

user  nginx;
worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';

  access_log /var/log/nginx/access.log main;
  sendfile        on;
  keepalive_timeout 65;
  client_max_body_size 50M;

  # Gzip
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
  gzip_min_length 1000;

  # ── Upstream services ──────────────────────────────────────────────────────
  upstream web_store  { server web-store:3000;  }
  upstream web_admin  { server web-admin:3002;  }
  upstream api        { server api:3001;        }

  # ── HTTP → HTTPS redirect + certbot ACME challenge ────────────────────────
  server {
    listen 80;
    server_name sarangijewels.com www.sarangijewels.com admin.sarangijewels.com api.sarangijewels.com;

    # Let's Encrypt webroot validation
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── sarangijewels.com (Web Store) ────────────────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name sarangijewels.com www.sarangijewels.com;

    ssl_certificate     /etc/nginx/certs/live/sarangijewels.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/sarangijewels.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Static assets — long cache
    location /_next/static/ {
      proxy_pass http://web_store;
      proxy_set_header Host $host;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      proxy_pass http://web_store;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }
  }

  # ── admin.sarangijewels.com (Web Admin) ─────────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name admin.sarangijewels.com;

    ssl_certificate     /etc/nginx/certs/live/sarangijewels.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/sarangijewels.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location / {
      proxy_pass http://web_admin;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }
  }

  # ── api.sarangijewels.com (NestJS API) ──────────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name api.sarangijewels.com;

    ssl_certificate     /etc/nginx/certs/live/sarangijewels.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/sarangijewels.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # API rate-limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

    location / {
      limit_req zone=api burst=20 nodelay;

      proxy_pass http://api;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }
  }
}
