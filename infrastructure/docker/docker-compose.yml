services:
  postgres:
    image: postgres:16-alpine
    container_name: sarangijewels-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sarangijewels
      POSTGRES_PASSWORD: sarangijewels_pass
      POSTGRES_DB: sarangijewels
    # Host 5433 — 5432 is often taken by system PostgreSQL
    ports:
      - '${SARANGI_POSTGRES_PORT:-5433}:5432'
    volumes:
      - sarangijewels_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sarangijewels -d sarangijewels']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sarangijewels-redis
    restart: unless-stopped
    # Host 6380 — 6379 is often taken by a system/local Redis
    ports:
      - '${SARANGI_REDIS_PORT:-6380}:6379'
    volumes:
      - sarangijewels_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: sarangijewels-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sarangijewels
      MINIO_ROOT_PASSWORD: sarangijewels-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - sarangijewels_minio_data:/data

volumes:
  sarangijewels_pg_data:
  sarangijewels_redis_data:
  sarangijewels_minio_data:
