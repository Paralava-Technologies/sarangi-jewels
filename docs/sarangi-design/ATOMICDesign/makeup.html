<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Makeup Kits &amp; Artist Booking — Sarangi Jewels</title>
<link rel="stylesheet" href="styles.css">
<script src="components.js"></script>
</head>
<body>

<sj-utility-bar></sj-utility-bar>
<sj-header active="makeup"></sj-header>



<sj-page-banner crumbs="Home / Rentals / Makeup" title="Makeup Kits &amp; Artist Booking" desc="Complete the look — in studio or at your doorstep"></sj-page-banner>

<section class="section">
  <div class="container">
    <sj-section-head eyebrow="Choose A Service" title="Makeup For Every Occasion"></sj-section-head>
    <div class="product-grid">
      <sj-product-card is-rent href="product.html" badge="For Rent" glyph="&#128132;" category="Makeup" title="Bridal Makeup Artist + Kit" price="₹3,500/session" rent-note="Home visit available"></sj-product-card>
      <sj-product-card is-rent href="product.html" badge="For Rent" glyph="&#128132;" category="Makeup" title="Dance Stage Makeup Kit" price="₹899/day" rent-note="Includes false lashes &amp; bindi set"></sj-product-card>
      <sj-product-card is-rent href="product.html" badge="For Rent" glyph="&#128132;" category="Makeup" title="Party Glam Artist Session" price="₹2,200/session" rent-note="Studio or home visit"></sj-product-card>
      <sj-product-card is-rent href="product.html" badge="For Rent" glyph="&#128132;" category="Makeup" title="Hairstyling + Draping Add-On" price="₹1,200/session" rent-note="Book with any makeup session"></sj-product-card>
    </div>
  </div>
</section>

<section class="section section-alt">
  <div class="container" style="max-width:760px;">
    <sj-section-head eyebrow="Book An Artist" title="Reserve Your Session"></sj-section-head>
    <div class="card-panel">
      <form onsubmit="return false;">
        <div class="field-row">
          <div class="field"><label>Service</label>
            <select><option>Bridal Makeup Artist + Kit</option><option>Dance Stage Makeup Kit</option><option>Party Glam Artist Session</option><option>Hairstyling + Draping Add-On</option></select>
          </div>
          <div class="field"><label>Location</label>
            <select><option>In-Store (Kochi)</option><option>Home Visit</option></select>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>Date</label><input type="date"></div>
          <div class="field"><label>Preferred Time</label><input type="time"></div>
        </div>
        <div class="field"><label>Address (if home visit)</label><input type="text" placeholder="Full address"></div>
        <button class="btn btn-gold" style="width:100%; justify-content:center;">Check Availability</button>
      </form>
    </div>
  </div>
</section>

<section class="section section-dark">
  <div class="container" style="text-align:center; max-width:640px;">
    <p class="eyebrow" style="color:var(--gold-light)">Pair It With</p>
    <h2 style="color:var(--ivory); font-size:2rem; margin:14px 0 16px;">Bridal Jewellery &amp; Dance Costumes</h2>
    <p style="color:var(--ivory-deep); margin-bottom:30px;">Book your makeup session alongside a rented bridal set or dance costume and have the full look arrive together.</p>
    <div class="hero-ctas">
      <a href="rentals.html#bridal" class="btn btn-ghost-light">Browse Bridal Sets</a>
      <a href="dance-costumes.html" class="btn btn-ghost-light">Browse Dance Costumes</a>
    </div>
  </div>
</section>

<sj-footer></sj-footer>
</body>
</html>
