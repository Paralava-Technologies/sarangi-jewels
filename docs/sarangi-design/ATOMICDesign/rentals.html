<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rentals — Bridal Jewellery, Dance Costumes &amp; Makeup | Sarangi Jewels</title>
<link rel="stylesheet" href="styles.css">
<script src="components.js"></script>
</head>
<body>

<sj-utility-bar></sj-utility-bar>
<sj-header active="rentals"></sj-header>



<sj-page-banner crumbs="Home / Rentals" title="Rent Jewellery, Dance Wear &amp; Makeup" desc="Look your best for the day — no lifetime commitment required"></sj-page-banner>

<section class="section" style="padding-bottom:40px;">
  <div class="container">
    <div class="rent-plan-toggle"><span class="active">By The Day</span><span>By The Event (3–5 Days)</span><span>Weekly</span></div>
  </div>
</section>

<section class="section" style="padding-top:0;" id="bridal">
  <div class="container">
    <sj-section-head eyebrow="Bridal &amp; Occasion Jewellery" title="Statement Sets, By The Day"></sj-section-head>
    <div class="product-grid">
      <sj-product-card is-rent href="product.html" badge="For Rent" glyph="&#128142;" category="Bridal Set" title="Kanjivaram Bridal Jewellery Set" price="₹1,899/day" rent-note="Deposit ₹5,000 · refundable"></sj-product-card>
      <sj-product-card is-rent href="product.html" badge="For Rent" glyph="&#128081;" category="Bridal Set" title="22k-Finish Kemp Bridal Haaram" price="₹2,299/day" rent-note="Deposit ₹6,000 · refundable"></sj-product-card>
      <sj-product-card is-rent href="product.html" badge="For Rent" glyph="&#128141;" category="Bridal Set" title="Reception Diamond-Finish Set" price="₹1,599/day" rent-note="Deposit ₹4,500 · refundable"></sj-product-card>
      <sj-product-card is-rent href="product.html" badge="For Rent" glyph="&#9833;" category="Bridal Set" title="Engagement Pearl &amp; Kundan Set" price="₹1,299/day" rent-note="Deposit ₹3,500 · refundable"></sj-product-card>
    </div>
  </div>
</section>

<section class="section section-alt" id="dance">
  <div class="container">
    <sj-section-head eyebrow="Classical Dance" title="Costumes &amp; Performance Jewellery"></sj-section-head>
    <div class="product-grid">
      <sj-product-card is-rent href="product.html" badge="For Rent" glyph="&#127917;" category="Bharatanatyam" title="Arangetram Performance Set" price="₹1,799/day" rent-note="Includes temple jewellery set"></sj-product-card>
      <sj-product-card is-rent href="product.html" badge="For Rent" glyph="&#127917;" category="Mohiniyattam" title="Classic Kasavu Performance Set" price="₹1,299/day" rent-note="Includes jewellery &amp; hair accessories"></sj-product-card>
      <sj-product-card is-rent href="product.html" badge="For Rent" glyph="&#127917;" category="Kathak" title="Ghagra Performance Ensemble" price="₹1,599/day" rent-note="Sizes 6–14 yrs and adult"></sj-product-card>
      <sj-product-card is-rent href="product.html" badge="For Rent" glyph="&#127917;" category="Kuchipudi" title="Temple-Border Performance Sari Set" price="₹1,499/day" rent-note="Includes belt &amp; jewellery"></sj-product-card>
    </div>
  </div>
</section>

<section class="section" id="makeup">
  <div class="container">
    <sj-section-head eyebrow="Complete The Look" title="Makeup Kits &amp; Artist Booking"></sj-section-head>
    <div class="product-grid">
      <sj-product-card is-rent href="product.html" badge="For Rent" glyph="&#128132;" category="Makeup" title="Bridal Makeup Artist + Kit" price="₹3,500/session" rent-note="Home visit available"></sj-product-card>
      <sj-product-card is-rent href="product.html" badge="For Rent" glyph="&#128132;" category="Makeup" title="Dance Stage Makeup Kit" price="₹899/day" rent-note="Includes false lashes &amp; bindi set"></sj-product-card>
      <sj-product-card is-rent href="product.html" badge="For Rent" glyph="&#128132;" category="Makeup" title="Party Glam Artist Session" price="₹2,200/session" rent-note="Studio or home visit"></sj-product-card>
      <sj-product-card is-rent href="product.html" badge="For Rent" glyph="&#128132;" category="Makeup" title="Hairstyling + Draping Add-On" price="₹1,200/session" rent-note="Book with any makeup session"></sj-product-card>
    </div>
  </div>
</section>

<section class="section section-dark" id="howitworks">
  <div class="container">
    <sj-section-head eyebrow="Simple &amp; Secure" title="How Renting Works"></sj-section-head>
    <div class="rent-steps">
      <sj-rent-step num="01" title="Pick Your Dates" desc="Choose the item and occasion dates on the calendar."></sj-rent-step>
      <sj-rent-step num="02" title="Reserve Online" desc="Pay the rental fee plus a fully refundable deposit."></sj-rent-step>
      <sj-rent-step num="03" title="Collect or Get Delivered" desc="Pick up from our Kochi store or choose doorstep delivery."></sj-rent-step>
      <sj-rent-step num="04" title="Return &amp; Relax" desc="We handle the cleaning. Deposit refunded within 48 hours."></sj-rent-step>
    </div>
  </div>
</section>

<sj-footer></sj-footer>
</body>
</html>
