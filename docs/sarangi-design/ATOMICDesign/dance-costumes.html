<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="styles.css">

</head>
<body>

<sj-utility-bar></sj-utility-bar>
<sj-header active="dance-costumes"></sj-header>



<sj-page-banner crumbs="Home / Rentals / Dance Costumes" title="Classical Dance Costumes" desc="Arangetrams, recitals and school performances — costumed and jewelled, ready to wear"></sj-page-banner>

<section class="section" style="padding-bottom:30px;">

      <span>Bharatanatyam</span>
      <span>Mohiniyattam</span>
      <span>Kathak</span>
      <span>Kuchipudi</span>

  </div>
</section>

<section class="section" style="padding-top:0;">
  <div class="container">
    <div class="product-grid">
      <sj-product-card is-rent href="product.html" badge="For Rent" glyph="&#127917;" category="Bharatanatyam" title="Arangetram Performance Set" price="₹1,799/day" rent-note="Includes temple jewellery set"></sj-product-card>
      <sj-product-card is-rent href="product.html" badge="For Rent" glyph="&#127917;" category="Mohiniyattam" title="Classic Kasavu Performance Set" price="₹1,299/day" rent-note="Includes jewellery &amp; hair accessories"></sj-product-card>
      <sj-product-card is-rent href="product.html" badge="For Rent" glyph="&#127917;" category="Kathak" title="Ghagra Performance Ensemble" price="₹1,599/day" rent-note="Sizes 6–14 yrs and adult"></sj-product-card>
      <sj-product-card is-rent href="product.html" badge="For Rent" glyph="&#127917;" category="Kuchipudi" title="Temple-Border Performance Sari Set" price="₹1,499/day" rent-note="Includes belt &amp; jewellery"></sj-product-card>
      <sj-product-card is-rent href="product.html" badge="For Rent" glyph="&#127917;" category="Bharatanatyam" title="Junior Recital Set (Ages 6–10)" price="₹999/day" rent-note="Includes jewellery &amp; hairpiece"></sj-product-card>
      <sj-product-card is-rent href="product.html" badge="For Rent" glyph="&#127917;" category="Mohiniyattam" title="Off-White Gold Border Set" price="₹1,399/day" rent-note="Includes jewellery &amp; hair accessories"></sj-product-card>
    </div>
  </div>
</section>

<section class="section section-alt">
  <div class="container">
    <sj-section-head eyebrow="What's Included" title="Every Costume Comes Complete"></sj-section-head>
    <div class="cat-grid">
      <div class="cat-card"><div class="cat-icon">&#127917;</div><h4>Costume &amp; Border Piece</h4><span>Pressed &amp; ready to wear</span></div>
      <div class="cat-card"><div class="cat-icon">&#128142;</div><h4>Performance Jewellery</h4><span>Temple set, bangles, belt</span></div>
      <div class="cat-card"><div class="cat-icon">&#128081;</div><h4>Hair Accessories</h4><span>Jada billa, hairpiece &amp; pins</span></div>
      <div class="cat-card"><div class="cat-icon">&#128132;</div><h4>Add Stage Makeup</h4><span>Bundle with a makeup kit — see below</span></div>
    </div>
    <div style="text-align:center; margin-top:44px;"><a href="makeup.html" class="btn btn-gold">Add Stage Makeup To Your Booking</a></div>
  </div>

<sj-footer></sj-footer>
