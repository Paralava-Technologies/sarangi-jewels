<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Sarangi Admin</title>
<link rel="stylesheet" href="admin-styles.css">
</head>
<body>

<div class="admin-login-wrap">
  <div class="admin-login-box">
    <img src="assets/sarangi-logo-mark.png" alt="Sarangi Jewels" style="margin:0 auto 16px; display:block;">
    <span class="eyebrow">Admin Console</span>
    <h1>Sign In</h1>
    <form onsubmit="return false;">
      <div class="field"><label>Email</label><input type="email" placeholder="you@sarangijewels.com"></div>
      <div class="field"><label>Password</label><input type="password" placeholder="••••••••"></div>
      <label style="display:flex; align-items:center; gap:8px; font-size:.82rem; color:var(--mute); margin-bottom:20px;">
        <input type="checkbox" style="width:auto;"> Keep me signed in
      </label>
      <a href="dashboard.html" class="btn btn-primary btn-block">Sign In</a>
    </form>
    <p style="text-align:center; font-size:.78rem; color:var(--mute); margin-top:20px;">Staff access only · <a href="../index.html" style="color:var(--wine);">Back to storefront</a></p>
  </div>
</div>

</body>
</html>
